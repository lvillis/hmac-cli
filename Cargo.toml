[package]
name = "hmac-cli"
description = "🛠️ A command-line tool for generating HMAC signatures."
version = "0.1.20"
edition = "2021"
license = "MIT"

[[bin]]
name = "hmac"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.37", features = ["derive", "env"] }
tokio = { version = "1.44.2", default-features = false, features = ["rt", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12.15", default-features = false, features = ["rustls-tls", "hickory-dns"]}
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
hmac = "0.13.0-pre.4"
sha2 = "0.11.0-pre.4"
base64 = "0.22.1"
chrono = { version = "0.4.40", features = ["serde"] }
url = "2.5.4"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
dirs = "6.0.0"
toml = "0.8.20"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = "z"
lto = true

[package.metadata.release]
tag-prefix = ""
tag-name = "{{prefix}}{{version}}"
pre-release-commit-message = "chore: release {{crate_name}} version {{version}}"
tag-message = "chore: release {{crate_name}} version {{version}}"
pre-release-hook = ["git", "cliff", "-o", "CHANGELOG.md", "--tag", "{{version}}" ]
